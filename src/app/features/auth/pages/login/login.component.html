<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle">Please sign in to your account</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          class="form-control"
          [(ngModel)]="loginData.email"
          #email="ngModel"
          required
          email
          placeholder="Enter your email"
          [class.is-invalid]="email.invalid && email.touched">
        <div class="invalid-feedback" *ngIf="email.invalid && email.touched">
          <small *ngIf="email.errors?.['required']">Email is required</small>
          <small *ngIf="email.errors?.['email']">Please enter a valid email</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-input-container">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password"
            class="form-control"
            [(ngModel)]="loginData.password"
            #password="ngModel"
            required
            minlength="6"
            placeholder="Enter your password"
            [class.is-invalid]="password.invalid && password.touched">
          <button 
            type="button" 
            class="password-toggle-btn"
            (click)="togglePasswordVisibility()">
            <span>{{ showPassword ? '👁️' : '👁️‍🗨️' }}</span>
          </button>
        </div>
        <div class="invalid-feedback" *ngIf="password.invalid && password.touched">
          <small *ngIf="password.errors?.['required']">Password is required</small>
          <small *ngIf="password.errors?.['minlength']">Password must be at least 6 characters</small>
        </div>
      </div>

      <div class="form-options">
        <div class="checkbox-group">
          <input 
            type="checkbox" 
            id="remember" 
            name="remember"
            [(ngModel)]="loginData.rememberMe">
          <label for="remember" class="checkbox-label">Remember me</label>
        </div>
        <a href="#" class="forgot-password-link">Forgot password?</a>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary login-btn"
        [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading" class="loading-spinner"></span>
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>

      <!-- <div class="login-divider">
        <span>or</span>
      </div> -->

      <div class="social-login">
        <button type="button" class="btn btn-outline social-btn google-btn">
          <span class="social-icon">🔍</span>
          Continue with Google
        </button>
      </div>

      <div class="signup-prompt">
        <p>Don't have an account? <a routerLink="/auth/register" class="signup-link">Sign up here</a></p>
      </div>
    </form>
  </div>

  <!-- Login Status Messages -->
  <div class="login-messages" *ngIf="loginMessage">
    <div class="alert" [class.alert-success]="isLoginSuccess" [class.alert-danger]="!isLoginSuccess">
      {{ loginMessage }}
    </div>
  </div>
</div>
